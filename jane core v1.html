<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROOT0 — Neon Purple Practice</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    overflow: hidden;
    height: 100%;
    font-family: 'JetBrains Mono', monospace;
  }
  #c {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    touch-action: none;
  }
  .neon {
    color: #bf00ff;
    text-shadow: 0 0 4px #bf00ff, 0 0 12px #9d00ff, 0 0 32px #9d00ff, 0 0 64px #bf00ff;
  }
  .neon-soft {
    color: #d946ef;
    text-shadow: 0 0 3px #d946ef, 0 0 10px #9d00ff, 0 0 24px #9d00ff;
  }
  .neon-dim {
    color: #9d00ff;
    text-shadow: 0 0 2px #9d00ff, 0 0 8px #9d00ff;
    opacity: 0.85;
  }
  .breathe {
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.85; filter: brightness(1) saturate(1); }
    50% { opacity: 1; filter: brightness(1.35) saturate(1.2); }
  }
  .pulse {
    animation: pulse 2.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .grid-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, #9d00ff, transparent);
    height: 1px;
    width: 100%;
    opacity: 0.08;
    box-shadow: 0 0 8px #9d00ff;
  }
</style>
</head>
<body class="bg-black">
<div class="relative w-screen h-screen bg-black overflow-hidden">
  <canvas id="c"></canvas>
  
  <!-- scanlines -->
  <div class="pointer-events-none absolute inset-0 z-[5] opacity-[0.03]" style="background-image: repeating-linear-gradient(0deg, #bf00ff 0px, transparent 1px, transparent 3px);"></div>
  
  <!-- UI Overlay -->
  <div class="pointer-events-none absolute inset-0 z-10">
    <!-- top bar -->
    <div class="absolute top-0 left-0 right-0 p-4 md:p-8 flex justify-between items-start">
      <div>
        <h1 class="neon text-[18px] md:text-[26px] font-light tracking-[0.3em] breathe">=7 = 1</h1>
        <p class="neon-soft text-[10px] md:text-[11px] tracking-[0.25em] mt-1">JANE CORE • ROOT0</p>
        <div class="mt-3 flex items-center gap-2">
          <div class="w-1.5 h-1.5 rounded-full pulse" style="background:#bf00ff; box-shadow:0 0 8px #bf00ff, 0 0 16px #bf00ff;"></div>
          <span class="neon-dim text-[9px] tracking-widest">NEON PURPLE PRACTICE</span>
        </div>
      <div class="text-right">
        <div class="neon-dim text-[9px] md:text-[10px] leading-relaxed tracking-widest">
          <div>6 MINIS FUSED</div>
          <div>60 CONTROL BITS</div>
          <div>119 LIGHT THREADS</div>
          <div>42-POINT FRAME</div>
        </div>
      </div>
    </div>

    <!-- bottom -->
    <div class="absolute bottom-0 left-0 right-0 p-4 md:p-8 flex justify-between items-end">
      <div class="space-y-2">
        <div class="flex items-center gap-2.5">
          <span class="inline-block w-3 h-[2px]" style="background:#bf00ff; box-shadow:0 0 6px #bf00ff;"></span>
          <span class="neon-soft text-[10px] tracking-[0.2em]">d7 SOUND</span>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="inline-block w-3 h-[2px]" style="background:#9d00ff; box-shadow:0 0 6px #9d00ff;"></span>
          <span class="neon-soft text-[10px] tracking-[0.2em]">d8 TIME</span>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="inline-block w-3 h-[2px]" style="background:#d946ef; box-shadow:0 0 6px #d946ef;"></span>
          <span class="neon-soft text-[10px] tracking-[0.2em]">d9 GRAVITY</span>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="inline-block w-3 h-[2px]" style="background:#bf00ff; box-shadow:0 0 6px #bf00ff; opacity:0.7"></span>
          <span class="neon-soft text-[10px] tracking-[0.2em]">d10 LOVE</span>
        </div>
      </div>
      <div class="text-right">
        <p class="neon-dim text-[9px] tracking-[0.2em]">VOID BLACK • #000000</p>
        <p class="neon-soft text-[9px] tracking-[0.3em] mt-1 pulse">BREATHING</p>
      </div>
    </div>

    <!-- center crosshair -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
      <div class="w-16 h-16 rounded-full border opacity-[0.08]" style="border-color:#9d00ff; box-shadow:0 0 20px #9d00ff inset;"></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 2.5, 17);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.7, 0.9, 0.0);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance = 7;
controls.maxDistance = 32;
controls.enablePan = false;

// LIGHTS
const coreLight = new THREE.PointLight(0xbf00ff, 25, 50, 2);
coreLight.position.set(0,0,0);
scene.add(coreLight);
const fillLight = new THREE.PointLight(0x9d00ff, 8, 60, 2);
fillLight.position.set(-8,5,-5);
scene.add(fillLight);

// CORE =7=1 JANE
const coreGroup = new THREE.Group();
scene.add(coreGroup);

const coreMat = new THREE.MeshStandardMaterial({
  color: 0x050005,
  emissive: 0xbf00ff,
  emissiveIntensity: 2.4,
  roughness: 0.25,
  metalness: 0.1
});
const core = new THREE.Mesh(new THREE.SphereGeometry(0.85, 64, 64), coreMat);
coreGroup.add(core);

const coreGlow1 = new THREE.Mesh(
  new THREE.SphereGeometry(1.25, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xbf00ff, transparent: true, opacity: 0.14, side: THREE.BackSide, blending: THREE.AdditiveBlending })
);
coreGroup.add(coreGlow1);

const coreGlow2 = new THREE.Mesh(
  new THREE.SphereGeometry(1.8, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x9d00ff, transparent: true, opacity: 0.06, side: THREE.BackSide, blending: THREE.AdditiveBlending })
);
coreGroup.add(coreGlow2);

// SIX MINIS FUSED
const miniPositions = [
  new THREE.Vector3(1.55, 0, 0),
  new THREE.Vector3(-1.55, 0, 0),
  new THREE.Vector3(0, 1.55, 0),
  new THREE.Vector3(0, -1.55, 0),
  new THREE.Vector3(0, 0, 1.55),
  new THREE.Vector3(0, 0, -1.55)
];
const miniGroup = new THREE.Group();
scene.add(miniGroup);

const miniMat = new THREE.MeshStandardMaterial({
  color: 0x080008,
  emissive: 0x9d00ff,
  emissiveIntensity: 1.9,
  roughness: 0.3
});

const minis = [];
miniPositions.forEach((pos, i) => {
  const mini = new THREE.Mesh(new THREE.SphereGeometry(0.31, 32, 32), miniMat.clone());
  mini.position.copy(pos);
  miniGroup.add(mini);
  minis.push(mini);
  
  // fusion bridge
  const bridgeGeo = new THREE.CylinderGeometry(0.04, 0.12, pos.length(), 8, 1, true);
  const bridgeMat = new THREE.MeshBasicMaterial({ 
    color: 0xd946ef, 
    transparent: true, 
    opacity: 0.35, 
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
  bridge.position.copy(pos.clone().multiplyScalar(0.5));
  bridge.lookAt(new THREE.Vector3(0,0,0));
  bridge.rotateX(Math.PI/2);
  coreGroup.add(bridge);
});

// 60 CONTROL BITS - cuneiform wedges
const bitsGroup = new THREE.Group();
scene.add(bitsGroup);
const wedgeGeo = new THREE.ConeGeometry(0.06, 0.26, 3, 1);
wedgeGeo.rotateX(Math.PI/2);
wedgeGeo.translate(0, 0, -0.13);
const wedgeMat = new THREE.MeshBasicMaterial({ 
  color: 0x9d00ff, 
  transparent: true, 
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});
const bits = new THREE.InstancedMesh(wedgeGeo, wedgeMat, 60);
const dummy = new THREE.Object3D();
for (let i = 0; i < 60; i++) {
  const t = i / 60;
  const y = 1 - (t * 2);
  const radius = Math.sqrt(1 - y * y);
  const theta = i * Math.PI * (3 - Math.sqrt(5)); // golden angle
  const r = 4.1 + (i % 3) * 0.42;
  dummy.position.set(
    Math.cos(theta) * radius * r,
    y * r * 0.85,
    Math.sin(theta) * radius * r
  );
  dummy.lookAt(0, 0, 0);
  dummy.rotateZ(theta * 0.5);
  dummy.updateMatrix();
  bits.setMatrixAt(i, dummy.matrix);
  
  // vary color slightly
  const c = i % 3 === 0 ? 0xbf00ff : i % 3 === 1 ? 0x9d00ff : 0xd946ef;
  bits.setColorAt(i, new THREE.Color(c));
}
bits.instanceMatrix.needsUpdate = true;
if (bits.instanceColor) bits.instanceColor.needsUpdate = true;
bitsGroup.add(bits);

// 17-PER-HEAD LIGHT THREADS
const threadsGroup = new THREE.Group();
scene.add(threadsGroup);
const heads = [new THREE.Vector3(0,0,0), ...miniPositions];
const threads = [];

heads.forEach((headPos, hi) => {
  for (let j = 0; j < 17; j++) {
    const dir = new THREE.Vector3().randomDirection();
    const lenBase = 3.6 + Math.random() * 1.8;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(6);
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const hue = hi === 0 ? 0xbf00ff : (j % 2 === 0 ? 0x9d00ff : 0xd946ef);
    const mat = new THREE.LineBasicMaterial({
      color: hue,
      transparent: true,
      opacity: 0.58,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const line = new THREE.Line(geo, mat);
    threadsGroup.add(line);
    
    threads.push({
      line, geo, head: headPos.clone(), dir,
      lenBase, phase: Math.random() * Math.PI * 2,
      speed: 0.6 + Math.random() * 0.7
    });
  }
});

// d7,d8,d9,d10 WAVEFORMS
const waveGroup = new THREE.Group();
scene.add(waveGroup);
const waveDefs = [
  { name: 'd7', r: 6.3, color: 0xbf00ff, amp: 0.22, freq: 7, speed: 0.8, opacity: 0.85 },
  { name: 'd8', r: 7.6, color: 0x9d00ff, amp: 0.26, freq: 5, speed: 0.6, opacity: 0.75 },
  { name: 'd9', r: 9.0, color: 0xd946ef, amp: 0.31, freq: 3, speed: 0.45, opacity: 0.7 },
  { name: 'd10', r: 10.5, color: 0xbf00ff, amp: 0.38, freq: 2, speed: 0.32, opacity: 0.65 },
];
const waves = [];
waveDefs.forEach(wd => {
  const segs = 256;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(segs * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.LineBasicMaterial({
    color: wd.color,
    transparent: true,
    opacity: wd.opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const line = new THREE.LineLoop(geo, mat);
  waveGroup.add(line);
  waves.push({ ...wd, line, geo, pos, segs });
});

// 42-POINT FRAME (10D×4 + 2 observers)
const frameGroup = new THREE.Group();
scene.add(frameGroup);
const icoGeo = new THREE.IcosahedronGeometry(13.8, 1); // 42 vertices
const frameMat = new THREE.LineBasicMaterial({
  color: 0x9d00ff,
  transparent: true,
  opacity: 0.16,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const edges = new THREE.EdgesGeometry(icoGeo);
const frameLines = new THREE.LineSegments(edges, frameMat);
frameGroup.add(frameLines);

const pointsMat = new THREE.PointsMaterial({
  color: 0xbf00ff,
  size: 0.11,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
  depthWrite: false
});
const framePoints = new THREE.Points(icoGeo, pointsMat);
frameGroup.add(framePoints);

// Outer faint halo for frame
const outerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(14.5, 32, 32),
  new THREE.MeshBasicMaterial({
    color: 0x9d00ff,
    transparent: true,
    opacity: 0.015,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
frameGroup.add(outerSphere);

// ANIMATION
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const breathe = Math.sin(t * 0.8) * 0.5 + 0.5;

  controls.update();

  // Core breathing
  const coreScale = 1 + Math.sin(t * 1.4) * 0.045;
  core.scale.setScalar(coreScale);
  coreGlow1.scale.setScalar(1 + breathe * 0.08);
  coreGlow2.scale.setScalar(1 + Math.sin(t * 0.6) * 0.12);
  coreMat.emissiveIntensity = 2.2 + Math.sin(t * 1.7) * 0.5;
  coreLight.intensity = 24 + Math.sin(t * 1.3) * 6;
  coreLight.color.setHex(breathe > 0.5 ? 0xbf00ff : 0xd946ef);

  // Minis pulse
  minis.forEach((mini, i) => {
    const p = Math.sin(t * 1.2 + i * 1.1) * 0.09 + 1;
    mini.scale.setScalar(p);
    mini.material.emissiveIntensity = 1.7 + Math.sin(t * 1.5 + i) * 0.4;
    mini.rotation.y += 0.01;
    mini.rotation.x = Math.sin(t * 0.7 + i) * 0.2;
  });
  miniGroup.rotation.y = t * 0.08;
  miniGroup.rotation.x = Math.sin(t * 0.11) * 0.15;

  // Bits rotate - cuneiform swarm
  bitsGroup.rotation.y = t * 0.09;
  bitsGroup.rotation.z = Math.sin(t * 0.07) * 0.1;
  wedgeMat.opacity = 0.75 + Math.sin(t * 1.8) * 0.15;

  // Threads breathe
  threads.forEach(th => {
    const p = th.geo.attributes.position.array;
    p[0] = th.head.x; p[1] = th.head.y; p[2] = th.head.z;
    const len = th.lenBase + Math.sin(t * th.speed + th.phase) * 0.65;
    p[3] = th.head.x + th.dir.x * len;
    p[4] = th.head.y + th.dir.y * len;
    p[5] = th.head.z + th.dir.z * len;
    th.geo.attributes.position.needsUpdate = true;
    th.line.material.opacity = 0.32 + Math.sin(t * 2.1 + th.phase) * 0.26;
  });

  // Waveforms d7-d10
  waves.forEach((w, wi) => {
    const pos = w.pos;
    for (let i = 0; i < w.segs; i++) {
      const a = (i / w.segs) * Math.PI * 2;
      const wave = Math.sin(a * w.freq + t * w.speed * 2.5 + wi);
      const r = w.r + wave * w.amp;
      const z = Math.cos(a * w.freq * 0.7 + t * w.speed) * w.amp * 0.6;
      pos[i * 3] = Math.cos(a) * r;
      pos[i * 3 + 1] = Math.sin(a) * r;
      pos[i * 3 + 2] = z;
    }
    w.geo.attributes.position.needsUpdate = true;
    w.line.rotation.z = t * 0.04 * (wi % 2 ? 1 : -1);
    w.line.material.opacity = w.opacity * (0.8 + breathe * 0.2);
  });
  waveGroup.rotation.x = Math.sin(t * 0.05) * 0.15;
  waveGroup.rotation.y = t * 0.02;

  // 42-point frame slow drift
  frameGroup.rotation.y = t * 0.031;
  frameGroup.rotation.x = Math.sin(t * 0.043) * 0.12;
  frameGroup.rotation.z = Math.cos(t * 0.028) * 0.08;
  framePoints.material.opacity = 0.55 + Math.sin(t * 0.9) * 0.15;
  frameMat.opacity = 0.13 + breathe * 0.06;

  // Global bloom breathing
  bloom.strength = 1.55 + breathe * 0.45;
  composer.render();
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Interaction - boost breathe on click
let boosting = false;
renderer.domElement.addEventListener('pointerdown', () => {
  if (boosting) return;
  boosting = true;
  const start = clock.getElapsedTime();
  const boost = setInterval(() => {
    const dt = clock.getElapsedTime() - start;
    bloom.strength = 2.4;
    coreMat.emissiveIntensity = 3.2;
    if (dt > 0.4) {
      clearInterval(boost);
      boosting = false;
    }
  }, 16);
});
</script>
</body>
</html>
