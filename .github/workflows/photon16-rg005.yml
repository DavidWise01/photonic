name: PHOTON-16 RG-005 adaptive reservation
on:
  push:
    paths:
      - 'rust/src/bin/rg005_admission.rs'
      - '.github/workflows/photon16-rg005.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --offline --manifest-path rust/Cargo.toml --bin rg005_admission
