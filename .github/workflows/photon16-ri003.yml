name: PHOTON-16 RI-003 identity
on:
  push:
    paths:
      - 'rust/src/resource_abi.rs'
      - 'rust/test-ri003-identity.mjs'
      - 'photon16/qualification/ri003-*'
      - '.github/workflows/photon16-ri003.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.1 --target wasm32-unknown-unknown
      - run: cargo +1.85.1 build --offline --release --manifest-path rust/Cargo.toml --lib --target wasm32-unknown-unknown
      - run: node rust/test-ri003-identity.mjs rust/target/wasm32-unknown-unknown/release/photon16.wasm
