name: PHOTON-16 WASM
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish complete tracked site (requires Pages source = GitHub Actions)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: photon16-wasm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Adversarial release adjudication regressions
        run: node rust/test-adjudicate.cjs
      - name: Witness authority separation regressions
        run: node rust/test-witness.cjs
      - name: External custody lifecycle regressions
        run: node rust/test-custody.cjs
      - name: Temporal witness authorization regressions
        run: node rust/test-temporal-witness.cjs
      - name: Authenticated checkpoint progression regressions
        run: node rust/test-checkpoint.cjs
      - name: Custodian transition regressions
        run: node rust/test-custodian-transition.cjs
      - name: Authenticated registry fork regressions
        run: node rust/test-registry-fork.cjs
      - name: Independent custody ancestry regressions
        run: node rust/test-independent-custody.cjs
      - name: Blind witness commitment regressions
        run: node rust/test-blind-witness.cjs
      - name: External reproduction comparison regressions
        run: node rust/test-external-reproduction.cjs
      - name: Deployment identity and protocol downgrade regressions
        run: node rust/test-live-pages.cjs
      - name: Complete synthetic V3 composition
        run: node rust/test-composite-qualification.cjs
      - name: Cross-module adversarial integration
        run: node rust/test-composite-adversarial.cjs
      - name: Journal retained checkpoint regressions
        run: node rust/test-journal-checkpoint.cjs
      - run: rustup toolchain install 1.85.1 --target wasm32-unknown-unknown
      - run: cargo +1.85.1 test --manifest-path rust/Cargo.toml
      - name: Native Rust JavaScript qualification parity
        run: |
          cargo +1.85.1 build --offline --manifest-path rust/Cargo.toml --bin qualification_parity --target-dir rust/target
          node rust/test-qualification-parity.cjs rust/target/debug/qualification_parity
      - name: Reproduce WASM from two clean source trees
        run: |
          mkdir -p "$RUNNER_TEMP/photon-a" "$RUNNER_TEMP/photon-b" verified
          for lane in a b; do
            root="$RUNNER_TEMP/photon-$lane"
            git archive HEAD | tar -x -C "$root"
            CARGO_INCREMENTAL=0 RUSTFLAGS="--remap-path-prefix=$root=/photon" cargo +1.85.1 build --release --offline --lib --target wasm32-unknown-unknown --manifest-path "$root/rust/Cargo.toml" --target-dir "$root/target"
          done
          a="$RUNNER_TEMP/photon-a/target/wasm32-unknown-unknown/release/photon16.wasm"
          b="$RUNNER_TEMP/photon-b/target/wasm32-unknown-unknown/release/photon16.wasm"
          cmp "$a" "$b"
          printf 'build-a %s\nbuild-b %s\n' "$(sha256sum "$a" | cut -d' ' -f1)" "$(sha256sum "$b" | cut -d' ' -f1)" > verified/REPRODUCTION
          cp "$a" verified/photon16.wasm
      - run: node rust/verify-wasm.cjs verified/photon16.wasm
      - name: Prepare verified binary and provenance
        run: |
          mkdir -p verified
          (cd verified && sha256sum photon16.wasm > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > verified/SOURCE_COMMIT
          rustc +1.85.1 --version --verbose > verified/RUST_TOOLCHAIN
          node --version > verified/NODE_VERSION
          git ls-files -s rust photon16/v83-rust-wasm.js .github/workflows/photon16-wasm.yml > verified/SOURCE_INDEX
          printf '%s\n' 'native-tests=PASS' 'wasm-verifier=PASS' 'same-runner-reproduction=PASS' 'browser-acceptance=UNVERIFIED' > verified/QUALIFICATION
      - name: Stage complete tracked site
        run: |
          mkdir site
          git archive HEAD | tar -x -C site
          rm -rf site/.github
          mkdir -p site/photon16/wasm
          cp verified/* site/photon16/wasm/
          touch site/.nojekyll
      - name: Install pinned browser test runner
        run: |
          npm install --prefix rust --no-save --no-package-lock playwright@1.51.1
          rust/node_modules/.bin/playwright install --with-deps chromium
      - name: Blocking Chromium acceptance
        run: node rust/verify-browser.cjs site
      - name: Finalize qualification evidence
        run: |
          printf '%s\n' 'native-tests=PASS' 'wasm-verifier=PASS' 'same-runner-reproduction=PASS' 'browser-acceptance=PASS' > verified/QUALIFICATION
          node -e 'const fs=require("fs"),crypto=require("crypto"),assert=require("assert/strict");const e=JSON.parse(fs.readFileSync("verified/BROWSER_ACCEPTANCE.json"));assert.equal(e.sourceCommit,process.env.GITHUB_SHA);assert.equal(e.wasmSha256,crypto.createHash("sha256").update(fs.readFileSync("verified/photon16.wasm")).digest("hex"));assert.ok(e.servedHashes.length>=3&&e.servedHashes.every(h=>h===e.wasmSha256));'
          (cd verified && sha256sum photon16.wasm SOURCE_COMMIT SOURCE_INDEX RUST_TOOLCHAIN NODE_VERSION REPRODUCTION QUALIFICATION BROWSER_ACCEPTANCE.json browser-rust.png > RELEASE_SHA256SUMS && sha256sum -c RELEASE_SHA256SUMS)
          node rust/adjudicate-release.cjs verified
          node rust/witness-authority.cjs verified
          cp verified/* site/photon16/wasm/
      - uses: actions/upload-artifact@v4
        with:
          name: photon16-wasm
          path: verified/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_pages)
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_pages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
