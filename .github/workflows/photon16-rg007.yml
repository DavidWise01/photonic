name: PHOTON-16 RG-007 identity fencing
on:
  push:
    paths:
      - 'rust/src/bin/rg007_fencing.rs'
      - '.github/workflows/photon16-rg007.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fencing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --offline --manifest-path rust/Cargo.toml --bin rg007_fencing
