name: PHOTON-16 RI-001 unified governance
on:
  push:
    paths:
      - 'rust/src/resource_governance.rs'
      - 'rust/src/lib.rs'
      - '.github/workflows/photon16-ri001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --offline --manifest-path rust/Cargo.toml --lib resource_governance::tests -- --nocapture
