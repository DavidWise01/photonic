<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RI-003 identity laboratory</title><style>body{background:#080a18;color:#baffed;font:16px monospace;max-width:900px;margin:40px auto;padding:20px}h1{color:#ff8833}canvas{width:100%;border:1px solid #ad65ff}button{background:#151833;color:#00ffee;border:1px solid #00ffee;padding:12px}a{color:#00ffee}pre{white-space:pre-wrap}</style><h1>PHOTON-16 / RI-003</h1><p>Worker object + allocation + generation + request · .dlw</p><canvas width="800" height="420"></canvas><button id="run">Run real isolated echo workers</button><pre id="out" role="status">Not executed.</pre><p>No simulated return is issued. Echo acceptance is not termination evidence.</p><a href="RI-002-lab.html">RI-002</a> · <a href="RG-008-freeze.html">Phase VII freeze</a><script type="module">import{IdentityAdapter}from './ri003-adapter.mjs';const c=document.querySelector('canvas').getContext('2d');function draw(t){c.fillStyle='#080a18';c.fillRect(0,0,800,420);let a=t/2500,V=Array.from({length:16},(_,i)=>{let [x,y,z,w]=Array.from({length:4},(_,j)=>i>>j&1?1:-1);[x,w]=[x*Math.cos(a)-w*Math.sin(a),x*Math.sin(a)+w*Math.cos(a)];let k=4/(4-w);[x,z]=[x*.82-z*.57,x*.57+z*.82];return [400+x*k*110/(1-z*.1),190+y*k*110/(1-z*.1)]});for(let i=0;i<16;i++)for(let j=0;j<4;j++){let k=i^(1<<j);if(i>=k)continue;c.strokeStyle=c.shadowColor=['#ff8833','#00ffee','#ad65ff','#659aff'][j];c.shadowBlur=14;c.beginPath();c.moveTo(...V[i]);c.lineTo(...V[k]);c.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);const b=document.querySelector('#run'),out=document.querySelector('#out');b.onclick=async()=>{b.disabled=true;let workers=[];try{const r=await fetch('../wasm/photon16.wasm');if(!r.ok)throw Error('HTTP '+r.status);const e=(await WebAssembly.instantiate(await r.arrayBuffer(),{})).instance.exports;e.photon_rg_reset();const a=new IdentityAdapter(e);for(let i=0;i<2;i++){if(e.photon_rg_step(0,1)!==1||e.photon_rg_step(1,0)!==1)throw Error('admission');workers.push(new Worker('./ri003-worker.js'));}const keys=workers.map((w,i)=>a.bind(i,w));const echo=(w,key)=>new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('deadline')),3000);w.onmessage=ev=>{clearTimeout(timer);resolve(ev.data)};w.onerror=ev=>{clearTimeout(timer);reject(Error(ev.message))};w.postMessage({kind:'echo',key})});const foreign=await echo(workers[1],keys[0]);const rejected=!a.observe(0,workers[1],foreign);const own=await echo(workers[0],keys[0]);const accepted=a.observe(0,workers[0],own),replay=!a.observe(0,workers[0],own);if(!rejected||!accepted||!replay)throw Error('identity check failed');out.textContent=JSON.stringify({foreignRejected:rejected,ownAccepted:accepted,replayRejected:replay,reservedBytes:e.photon_rg_metric(1),authority:'HOLD'},null,2)}catch(err){out.textContent='Unavailable: '+err.message}finally{workers.forEach(w=>w.terminate());b.disabled=false}};</script></html>
