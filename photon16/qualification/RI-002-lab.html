<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RI-002 · Native/WASM parity</title><style>body{background:#080a18;color:#baffed;font:16px monospace;max-width:900px;margin:40px auto;padding:20px}h1{color:#ff8833}canvas{width:100%;border:1px solid #ad65ff}a{color:#00ffee}button{background:#151833;color:#00ffee;border:1px solid #00ffee;padding:12px}pre{white-space:pre-wrap}</style><h1>PHOTON-16 / RI-002</h1><p>Qualification ABI 1 · 4096 events per session · .dlw</p><canvas width="800" height="420"></canvas><button id="run">Run isolated WASM qualification trace</button><pre id="result" role="status">Not executed. No fallback results.</pre><p>Simulated observer only; no production worker authority. Native parity verified separately in Actions.</p><a href="RI-001-lab.html">RI-001</a> · <a href="RG-008-freeze.html">Phase VII freeze</a><script>const c=document.querySelector('canvas').getContext('2d');let bytes=0;function draw(t){c.fillStyle='#080a18';c.fillRect(0,0,800,420);let a=t/2500,V=Array.from({length:16},(_,i)=>{let [x,y,z,w]=Array.from({length:4},(_,j)=>i>>j&1?1:-1);[x,w]=[x*Math.cos(a)-w*Math.sin(a),x*Math.sin(a)+w*Math.cos(a)];let k=4/(4-w);[x,z]=[x*.82-z*.57,x*.57+z*.82];return [400+x*k*100/(1-z*.1),180+y*k*100/(1-z*.1)]});let colors=['#ff8833','#00ffee','#ad65ff','#659aff'];for(let i=0;i<16;i++)for(let j=0;j<4;j++){let k=i^(1<<j);if(i>=k)continue;c.strokeStyle=c.shadowColor=colors[j];c.shadowBlur=14;c.beginPath();c.moveTo(...V[i]);c.lineTo(...V[k]);c.stroke()}c.shadowBlur=0;c.fillStyle='#00ffee';c.fillRect(30,375,740*bytes/17408,20);requestAnimationFrame(draw)}requestAnimationFrame(draw);document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result');try{const r=await fetch('../wasm/photon16.wasm');if(!r.ok)throw Error('HTTP '+r.status);const e=(await WebAssembly.instantiate(await r.arrayBuffer(),{})).instance.exports;if(e.photon_rg_abi()!==1)throw Error('ABI mismatch');e.photon_rg_reset();const rows=[];for(const [op,arg] of [[0,2],[1,0],[2,8],[6,0],[4,0],[4,0]]){const status=e.photon_rg_step(op,arg),m=Array.from({length:10},(_,k)=>e.photon_rg_metric(k));if(m[8]!==1||m[4]!==m[5]+m[0]||m[6]!==m[7]+m[1])throw Error('Conservation');bytes=m[1];rows.push({op,arg,status,active:m[0],bytes,conserved:m[8]===1});}out.textContent=JSON.stringify(rows,null,2)}catch(e){bytes=0;out.textContent='Unavailable: '+e.message;}};</script></html>
